name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for release recovery only (for example v0.1.0)
        required: true
        type: string
      source_ref:
        description: Source ref to build/publish (defaults to tag; use only for release recovery)
        required: false
        type: string

concurrency: release-${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Build release packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          PLOT_VERSION="$VERSION" bun run release:build
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: dist/release

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist/release
      - run: bun run release:smoke
      - name: Dry-run npm publish
        run: |
          VERSION="${RELEASE_TAG#v}"
          CHANNEL="latest"
          if [[ "$VERSION" == *-* ]]; then CHANNEL="beta"; fi
          PLOT_CHANNEL="$CHANNEL" bun run release:publish:dry-run

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: dist/release
      - name: Publish npm packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          CHANNEL="latest"
          if [[ "$VERSION" == *-* ]]; then CHANNEL="beta"; fi
          CI="true" PLOT_CHANNEL="$CHANNEL" bun run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_REF }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/**/*.tgz
